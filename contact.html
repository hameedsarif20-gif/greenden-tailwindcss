<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- tailwindcss cdn link -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <title>Product</title>
</head>

<body>
    <!-- responsive navbar -->
    <nav class="bg-green-100 p-3 flex items-center justify-between shadow-xl sticky top-0 z-10">
        <h1 class="text-2xl">Greenden</h1>

        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 md:hidden" fill="none" viewBox="0 0 24 24"
            stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>


        <ul class="flex gap-5 text-gray-600  hidden md:flex">
            <li>
                <a class="hover:underline hover:text-black" href="index.html">Home</a>
            </li>
            <li>
                <a class="hover:underline hover:text-black" href="product.html">products</a>
            </li>


        </ul>


    </nav>
    <!-- Contact Form -->
<section class="bg-white">
    <div class="py-8 lg:py-16 px-4 mx-auto max-w-screen-md">

        <h2 class="mb-4 text-4xl tracking-tight font-extrabold text-center text-gray-900">
            Contact Us
        </h2>

        <p class="mb-8 lg:mb-16 font-light text-center text-gray-500 sm:text-xl">
            Got a technical issue? Want to send feedback? Need details about our services? Let us know.
        </p>

        <form action="#" class="space-y-8">

            <!-- Email -->
            <div>
                <label for="email" class="block mb-2 text-sm font-medium text-gray-900">
                    Your email
                </label>
                <input type="email" id="email"
                    class="shadow-sm bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5 focus:ring-green-500 focus:border-green-500"
                    placeholder="name@example.com" required>
            </div>

            <!-- Subject -->
            <div>
                <label for="subject" class="block mb-2 text-sm font-medium text-gray-900">
                    Subject
                </label>
                <input type="text" id="subject"
                    class="block p-3 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 shadow-sm focus:ring-green-500 focus:border-green-500"
                    placeholder="Let us know how we can help you" required>
            </div>

            <!-- Message -->
            <div class="sm:col-span-2">
                <label for="message" class="block mb-2 text-sm font-medium text-gray-900">
                    Your message
                </label>
                <textarea id="message" rows="6"
                    class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg shadow-sm border border-gray-300 focus:ring-green-500 focus:border-green-500"
                    placeholder="Leave your message here..."></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit"
                class="py-3 px-5 text-sm font-medium text-center text-white rounded-lg bg-green-600 hover:bg-green-700 focus:ring-4 focus:outline-none focus:ring-green-300">
                Send message
            </button>

        </form>
    </div>
</section>

    <!-- FOOTER -->
    <section class="bg-green-100 p-10  flex flex-col gap-5">
        <h1 class="text-4xl font-bold">Greenden</h1>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Vero, nostrum.</p>
        <p>&copy;Greenden corp</p>
    </section>

</body>

</html>
